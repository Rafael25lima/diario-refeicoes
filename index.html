<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diário de refeições</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F4;--ink:#17191A;--mut:#666D70;--line:#D5D9D6;--card:#fff;--acc:#2250E8}
@media(prefers-color-scheme:dark){:root{--bg:#131515;--ink:#EEF0EF;--mut:#98A0A3;--line:#2E3335;--card:#1B1E1F;--acc:#6F92FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;margin:0 0 12px}
h2{font-size:15px;font-weight:600;margin:20px 0 6px}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
button{cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}
.row>.s{flex:0 0 auto}
.date{align-items:center}
.date input{text-align:center}
.label{background:var(--card);border:2px solid var(--ink);padding:10px 12px;margin:14px 0}
.label .t{font-weight:800;font-size:15px;border-bottom:8px solid var(--ink);padding-bottom:4px}
.kc{display:flex;justify-content:space-between;align-items:baseline;border-bottom:4px solid var(--ink);padding:6px 0}
.kc b{font-size:44px;font-weight:800;line-height:1}
.bar{height:6px;background:var(--line);margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc)}
.mac{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.mac:last-child{border:0}
.goal{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mut);font-size:14px}
.goal input{width:90px;padding:6px}
.ent{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.ent small{color:var(--mut);display:block}
.ent button{border:0;background:none;color:var(--mut);padding:4px 8px}
.mt{font-weight:600;display:flex;justify-content:space-between;margin-top:14px}
.mt span{color:var(--mut);font-weight:400}
details{margin-top:24px}
summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
.empty{color:var(--mut);padding:8px 0}
</style>
</head>
<body>
<main>
<h1>Diário de refeições</h1>

<div class="row date">
  <button class="s" id="prev" aria-label="Dia anterior">&lt;</button>
  <input type="date" id="date">
  <button class="s" id="next" aria-label="Próximo dia">&gt;</button>
</div>

<section class="label" aria-label="Total do dia">
  <div class="t">Total do dia</div>
  <div class="kc"><b id="kcal">0</b><span>kcal</span></div>
  <div class="bar"><i id="pb" style="width:0"></i></div>
  <div class="goal"><label for="goal">Meta de calorias</label><input type="number" id="goal" min="500" step="50"><span id="rest"></span></div>
  <div class="bar"><i id="pbp" style="width:0"></i></div>
  <div class="goal"><label for="pgoal">Meta de proteína (g)</label><input type="number" id="pgoal" min="20" step="5"><span id="prest"></span></div>
  <div class="mac"><span>Proteína</span><b id="tp">0 g</b></div>
  <div class="mac"><span>Carboidrato</span><b id="tc">0 g</b></div>
  <div class="mac"><span>Gordura</span><b id="tg">0 g</b></div>
</section>

<h2>Adicionar alimento</h2>
<div class="row"><select id="meal" aria-label="Refeição"></select></div>
<div class="row"><input id="food" list="fl" placeholder="Buscar alimento" autocomplete="off" aria-label="Alimento"><datalist id="fl"></datalist></div>
<div class="row">
  <input type="number" id="qty" min="0" step="any" inputmode="decimal" placeholder="Quantidade" aria-label="Quantidade">
  <select id="unit" aria-label="Unidade"><option value="g">gramas</option></select>
</div>
<div class="row"><button class="p" id="add">Adicionar</button></div>
<div id="err" class="empty" role="alert"></div>

<div id="log"></div>

<details>
  <summary>Tabela de alimentos (por 100 g)</summary>
  <table id="tb"></table>
  <h2>Cadastrar alimento</h2>
  <div class="row"><input id="nn" placeholder="Nome (ex.: Feijão preto cozido)"></div>
  <div class="row">
    <input id="nk" type="number" step="any" placeholder="kcal">
    <input id="np" type="number" step="any" placeholder="Prot. g">
    <input id="nc" type="number" step="any" placeholder="Carb. g">
    <input id="ng" type="number" step="any" placeholder="Gord. g">
  </div>
  <div class="row"><input id="nu" type="number" step="any" placeholder="Peso de 1 unidade em g (opcional)"></div>
  <div class="row"><button id="addf">Salvar alimento</button></div>
</details>
</main>

<script>
// n = nome, k = kcal, p = proteína, c = carboidrato, g = gordura (por 100 g), u = peso de 1 unidade em g (0 = sem unidade)
// Valores aproximados, baseados na tabela TACO. Edite à vontade.
const BASE=[
{n:"Arroz branco cozido",k:128,p:2.5,c:28.1,g:0.2,u:0},
{n:"Arroz integral cozido",k:124,p:2.6,c:25.8,g:1,u:0},
{n:"Feijão carioca cozido",k:76,p:4.8,c:13.6,g:0.5,u:0},
{n:"Frango peito grelhado",k:159,p:32,c:0,g:2.5,u:0},
{n:"Frango empanado",k:260,p:16,c:16,g:14,u:0},
{n:"Ovo cozido",k:146,p:13.3,c:0.6,g:9.5,u:50},
{n:"Ovo frito",k:240,p:15.6,c:1.2,g:18.6,u:50},
{n:"Carne patinho grelhado",k:219,p:35.9,c:0,g:7.3,u:0},
{n:"Carne moída refogada",k:212,p:26.7,c:0,g:10.9,u:0},
{n:"Batata-doce cozida",k:77,p:0.6,c:18.4,g:0.1,u:0},
{n:"Batata inglesa cozida",k:52,p:1.2,c:11.9,g:0,u:0},
{n:"Macarrão cozido",k:102,p:3.4,c:19.9,g:0.5,u:0},
{n:"Pão francês",k:300,p:8,c:58.6,g:3.1,u:50},
{n:"Pão de forma",k:253,p:9.4,c:49,g:3.7,u:25},
{n:"Banana prata",k:98,p:1.3,c:26,g:0.1,u:70},
{n:"Maçã",k:56,p:0.3,c:15.2,g:0,u:130},
{n:"Leite integral",k:61,p:3.2,c:4.7,g:3.3,u:0},
{n:"Aveia em flocos",k:394,p:13.9,c:66.6,g:8.5,u:0},
{n:"Queijo mussarela",k:330,p:22.6,c:3,g:25.2,u:20},
{n:"Azeite de oliva",k:884,p:0,c:0,g:100,u:13},
{n:"Pasta de amendoim",k:588,p:25,c:20,g:50,u:15},
{n:"Alface",k:11,p:1.4,c:1.7,g:0.2,u:0},
{n:"Tomate",k:15,p:1.1,c:3.1,g:0.2,u:0},
{n:"Shake do pote (5 scoops + 250 ml leite + 250 ml água)",k:746,p:32.2,c:111.3,g:19.1,u:100,dose:true},
{n:"Brócolis cozido",k:25,p:2.1,c:4.4,g:0.5,u:0}
];
const MEALS=["Café da manhã","Almoço","Lanche","Jantar"];
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1=n=>Math.round(n*10)/10;

let custom=ld("custom",[]), logs=ld("logs",{}), goal=ld("goal",3500), pgoal=ld("pgoal",130);
const foods=()=>BASE.concat(custom);
const find=n=>foods().find(f=>f.n.toLowerCase()===n.trim().toLowerCase());
const today=()=>new Date().toLocaleDateString("sv-SE");
const shift=d=>{const x=new Date($("date").value+"T12:00:00");x.setDate(x.getDate()+d);$("date").value=x.toLocaleDateString("sv-SE");render()};

function render(){
  const day=logs[$("date").value]||[];
  const t={k:0,p:0,c:0,g:0};
  day.forEach(e=>{t.k+=e.k;t.p+=e.p;t.c+=e.c;t.g+=e.g});
  $("kcal").textContent=Math.round(t.k);
  $("tp").textContent=r1(t.p)+" g";$("tc").textContent=r1(t.c)+" g";$("tg").textContent=r1(t.g)+" g";
  $("pb").style.width=Math.min(100,t.k/goal*100)+"%";
  const left=Math.round(goal-t.k);
  $("rest").textContent=left>=0?"faltam "+left+" kcal":"passou "+(-left)+" kcal";
  $("pbp").style.width=Math.min(100,t.p/pgoal*100)+"%";
  const pl=Math.round(pgoal-t.p);
  $("prest").textContent=pl>0?"faltam "+pl+" g":"meta batida";
  let h="";
  MEALS.forEach(m=>{
    const es=day.map((e,i)=>({e,i})).filter(x=>x.e.m===m);
    if(!es.length)return;
    const sub=es.reduce((a,x)=>a+x.e.k,0);
    h+=`<div class="mt">${esc(m)}<span>${Math.round(sub)} kcal</span></div>`;
    es.forEach(({e,i})=>{
      const q=e.d?`${e.q} dose`:e.ut==="un"?`${e.q} un (${r1(e.gr)} g)`:`${r1(e.gr)} g`;
      h+=`<div class="ent"><div>${esc(e.n)}<small>${q} · P ${r1(e.p)} · C ${r1(e.c)} · G ${r1(e.g)}</small></div><div><b>${Math.round(e.k)}</b> kcal <button data-i="${i}" aria-label="Remover ${esc(e.n)}">✕</button></div></div>`;
    });
  });
  $("log").innerHTML=h||'<div class="empty">Nenhum alimento neste dia. Adicione o primeiro acima.</div>';
  $("log").querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{
    day.splice(+b.dataset.i,1);logs[$("date").value]=day;sv("logs",logs);render();
  });
}

function renderFoods(){
  $("fl").innerHTML=foods().map(f=>`<option value="${esc(f.n)}">`).join("");
  $("tb").innerHTML="<tr><th>Alimento</th><th>kcal</th><th>P</th><th>C</th><th>G</th><th></th></tr>"+
    foods().map((f,i)=>`<tr><td>${esc(f.n)}${f.dose?" <small>(valores por dose)</small>":f.u?` <small>(1 un = ${f.u} g)</small>`:""}</td><td>${f.k}</td><td>${f.p}</td><td>${f.c}</td><td>${f.g}</td><td>${i>=BASE.length?`<button data-c="${i-BASE.length}" aria-label="Remover ${esc(f.n)}">✕</button>`:""}</td></tr>`).join("");
  $("tb").querySelectorAll("button[data-c]").forEach(b=>b.onclick=()=>{
    custom.splice(+b.dataset.c,1);sv("custom",custom);renderFoods();
  });
}

function setUnits(){
  const f=find($("food").value), u=$("unit");
  u.innerHTML='<option value="g">gramas</option>'+(f&&f.u?`<option value="un">${f.dose?"dose":`unidade (${f.u} g)`}</option>`:"");
  if(f&&f.dose)u.value="un";
}

$("food").oninput=setUnits;
$("add").onclick=()=>{
  const f=find($("food").value), q=parseFloat($("qty").value), ut=$("unit").value;
  if(!f){$("err").textContent="Escolha um alimento da lista ou cadastre um novo em \"Tabela de alimentos\".";return}
  if(!(q>0)){$("err").textContent="Informe a quantidade.";return}
  $("err").textContent="";
  const gr=ut==="un"?q*f.u:q, x=gr/100;
  const day=logs[$("date").value]||[];
  day.push({m:$("meal").value,n:f.n,q,ut,gr,d:f.dose?1:0,k:f.k*x,p:f.p*x,c:f.c*x,g:f.g*x});
  logs[$("date").value]=day;sv("logs",logs);
  $("food").value="";$("qty").value="";setUnits();render();
};
$("addf").onclick=()=>{
  const n=$("nn").value.trim(), k=parseFloat($("nk").value);
  if(!n||isNaN(k)){$("err").textContent="Cadastro precisa de nome e kcal por 100 g.";return}
  $("err").textContent="";
  custom.push({n,k,p:parseFloat($("np").value)||0,c:parseFloat($("nc").value)||0,g:parseFloat($("ng").value)||0,u:parseFloat($("nu").value)||0});
  sv("custom",custom);
  ["nn","nk","np","nc","ng","nu"].forEach(i=>$(i).value="");
  renderFoods();
};
$("goal").onchange=()=>{goal=parseFloat($("goal").value)||3500;sv("goal",goal);render()};
$("pgoal").onchange=()=>{pgoal=parseFloat($("pgoal").value)||130;sv("pgoal",pgoal);render()};
$("date").onchange=render;
$("prev").onclick=()=>shift(-1);
$("next").onclick=()=>shift(1);

$("meal").innerHTML=MEALS.map(m=>`<option>${m}</option>`).join("");
const h=new Date().getHours();
$("meal").value=h<10?MEALS[0]:h<15?MEALS[1]:h<18?MEALS[2]:MEALS[3];
$("date").value=today();
$("goal").value=goal;
$("pgoal").value=pgoal;
renderFoods();render();
</script>
</body>
</html>
